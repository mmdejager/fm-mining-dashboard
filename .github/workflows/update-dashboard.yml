name: Update mining dashboard

on:
  schedule:
    # Times are UTC (SAST = UTC+2)
    - cron: "*/30 3-19 * * 1-5"   # weekdays every 30 min, 05:00-21:30 SAST
    - cron: "17 */4 * * 0,6"      # weekends every 4 hours
  workflow_dispatch:              # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data.json", "*.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # always start from the latest version, not the commit that triggered the run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install packages
        run: pip install -r requirements-build.txt

      - name: Fetch prices and news
        run: python build_data.py

      - name: Check the data file is valid
        run: python -c "import json; json.load(open('docs/data.json')); print('data.json OK')"

      - name: Save data back to the repo
        run: |
          git config user.name "dashboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Put the fresh data on top of the latest main, so a newer upload can never cause a merge conflict
          cp docs/data.json "$RUNNER_TEMP/data.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/data.json" docs/data.json
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update dashboard data [skip ci]"
          git push origin HEAD:main || echo "Push skipped (the next run will save the data)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      # GitHub sometimes can't find the upload straight away ("No artifacts named github-pages").
      # If the first publish fails, wait a minute and try once more instead of failing the run.
      - id: deploy_first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the publish
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
